/* Formulaire de débrief avec notation accessible par étoiles */
.debrief-rating-panel{margin:14px 0;padding:13px;background:#fbfcfe;border:1px solid #e9edf3;border-radius:10px}
.debrief-rating-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}

.debrief-rating-heading>span{color:#8792a2;font-size:8px;text-align:right}
.debrief-score-list{display:grid;grid-template-columns:1fr;gap:7px}
.debrief-score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;margin:0;padding:9px 10px;min-width:0;border:1px solid #edf0f4;border-radius:8px;background:#fff;transition:border-color .15s,box-shadow .15s}
.debrief-score-row:focus-within{border-color:#b7c4ef;box-shadow:0 0 0 2px rgba(70,109,228,.08)}
.debrief-score-row legend{grid-column:1;padding:0;color:#44536a;font-size:9px;font-weight:750}
.debrief-score-row p{grid-column:1;margin:4px 0 0;color:#8792a2;font-size:8px;line-height:1.45}
.debrief-stars{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:1px}
.debrief-stars label{position:relative;display:grid;place-items:center;width:25px;height:29px;cursor:pointer;border-radius:5px}
.debrief-stars label>input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.debrief-stars label>span{color:#d8dee8;font-size:19px;line-height:1;transition:color .12s,transform .12s}
.debrief-stars label:hover>span{color:#e8b64d;transform:scale(1.12)}
.debrief-stars:has(input[value="1"]:checked) label:nth-child(-n+1)>span,.debrief-stars:has(input[value="2"]:checked) label:nth-child(-n+2)>span,.debrief-stars:has(input[value="3"]:checked) label:nth-child(-n+3)>span,.debrief-stars:has(input[value="4"]:checked) label:nth-child(-n+4)>span,.debrief-stars:has(input[value="5"]:checked) label:nth-child(-n+5)>span{color:#e7ad3e}
.debrief-stars label:has(input:focus-visible){outline:2px solid rgba(70,109,228,.45);outline-offset:1px}
.debrief-followup{gap:11px}
.debrief-rating-summary{display:flex;align-items:center;gap:8px;margin:10px 0;padding:9px 10px;background:#fafbfe;border:1px solid #edf0f4;border-radius:8px}
.debrief-rating-summary>span:first-child{display:flex;flex-direction:column;gap:3px;flex:1}
.debrief-rating-summary strong{font-size:8px;color:#526178}
.debrief-rating-summary small{font-size:7px;color:#98a2b0}
.debrief-rating-summary>b{font-size:9px;color:#526178;white-space:nowrap}
.debrief-stars-display{display:inline-flex;gap:1px;white-space:nowrap}
.debrief-stars-display span{color:#d9dee8;font-size:13px;line-height:1}
.debrief-stars-display span.filled{color:#e7ad3e}
.debrief-safety-note{margin-top:10px;color:#5f766e;background:#f0f8f4;border-color:#dceee5}
.debrief-safety-note .icon{color:#318c6d}
@media(max-width:510px){.debrief-rating-heading{flex-direction:column;gap:5px}.debrief-rating-heading>span{text-align:left}.debrief-score-row{grid-template-columns:1fr;row-gap:4px}.debrief-score-row legend,.debrief-score-row p,.debrief-stars{grid-column:1}.debrief-stars{grid-row:auto;margin-top:3px}}

/* Administration des rôles par activités */

.access-role-list{display:flex;flex-direction:column;gap:9px}

.access-role-actions{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid #f0f2f5}
.access-role-actions .btn .icon{width:12px;height:12px}
.access-role-actions>.badge{margin-left:auto}
.role-delete-button{margin-left:auto;padding:5px 7px;border:0;background:transparent;color:#bd5d63;font-size:8px;font-weight:650}
.role-delete-button:hover{background:#fff0f0;border-radius:5px}
.role-users-table td{vertical-align:middle}
.role-assignment-select{width:100%;min-width:130px;max-width:205px;height:30px;padding:0 7px;border:1px solid #e2e7ee;border-radius:6px;background:#fff;color:#465367;font-size:8px}

@media(max-width:600px){.role-activity-groups{grid-template-columns:1fr}.role-section-heading{align-items:flex-start}.role-section-heading>.btn{white-space:nowrap}.role-users-card .table-wrap{overflow-x:auto}}

/* Audio de session de débrief : fichier requis, aperçu local et dossier Drive réservé à la session. */
.debrief-audio-upload{padding:11px 12px;border:1px solid #e8edf4;border-radius:9px;background:#f9fafc;margin:11px 0 13px}

.debrief-audio-card{display:grid;gap:9px;padding:11px;margin:10px 0;border:1px solid #e6ebf2;border-radius:9px;background:#fbfcfe}

/* Statistiques calculées depuis les fiches, retours client et débriefs */
.dashboard-insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:16px;align-items:stretch}

function isSynergy1Evaluated(record){
  const evaluation=record?.internal1;if(!evaluation)return false;const status=String(evaluation.status||'').toUpperCase();const decision=String(evaluation.conformity||evaluation.decision||'').toUpperCase();

  const rows=[];const getRow=(code,name,team='')=>{
    let row=rows.find(item=>sameAgentIdentity(item.employeeCode,item.name,code,name));
    if(!row){row={employeeCode:String(code||''),name:String(name||'Agent non renseigné'),team,records:[],debriefs:[],linkedRecordIds:new Set()};rows.push(row)}
    if(!row.employeeCode&&code)row.employeeCode=String(code);if((!row.name||row.name==='Agent non renseigné')&&name)row.name=String(name);if(!row.team&&team)row.team=team;return row;
  };
  (state.agents||[]).forEach(agent=>getRow(agent.id,agent.name,agent.team));
  (state.records||[]).forEach(record=>getRow(record.employeeCode,record.agent).records.push(record));

function clientSendManifest(rows,result,sendId){

}

function renderWorkflowHistory(r){
  const entries=[];const add=(date,stage,result,tone,detail='',tab='')=>entries.push({date:date||r.createdAt||'',stage,result,tone,detail,tab});
  if(r.audio)add(r.audio.date_upload||r.createdAt,'Audio reçu','Ajouté','blue',r.audio.drive_file_name||'Enregistrement audio');
  const evaluations=(stage,current)=>[
    ...(r.evaluationHistory||[]).filter(ev=>ev.stage===stage),
    ...(current?[current]:[])
  ].sort((a,b)=>Number(a.version||0)-Number(b.version||0)||String(a.date||'').localeCompare(String(b.date||'')));
  for(const ev of evaluations('internal1',r.internal1)){
    const conforms=(ev.conformity||ev.donStatus)==='CONFORME';
    add(ev.date,'Synergy #1',conforms?'Conforme':'À revoir',conforms?'green':'red',`Version ${Number(ev.version)||1} · ${scoreFormat(ev.score)}`, 'internal1');
  }
  [...(r.clientSendHistory||[])].forEach((send,index)=>{
    const mode=send.exportMode==='EXCEL'?'Excel':send.exportMode==='AUDIO_ZIP'?'ZIP audio':send.exportMode==='BOTH'?'Excel + ZIP':send.exportMode||'Envoi';
    add(send.sentAt,'Envoi client',`Envoi #${index+1}`,'blue',`${mode} · ${send.ftpDestination?`FTP ${send.ftpDestination}`:'Dépôt FTP manuel'}`,'clientReturns');
  });
  for(const ev of [...getClientReturns(r)].sort((a,b)=>Number(a.returnNumber||0)-Number(b.returnNumber||0))){
    add(ev.receivedAt||ev.date,`Retour client #${Number(ev.returnNumber)||1}`,clientReturnStatusLabel(ev.finalStatus||ev.decision||'Reçu'),'purple',`Call 1 : ${ev.call1Status||'—'} · Déjà donateur : ${donorAnswerLabel(ev.alreadyDonor)}${ev.clientRemarks?` · ${ev.clientRemarks}`:''}`,'clientReturns');
  }
  for(const ev of evaluations('internal2',r.internal2)){
    const result=promiseStatusLabel(ev.promiseStatus||ev.finalStatus||ev.decision);
    const tone=(ev.donConformity||ev.donStatus||ev.conformity)==='NON_CONFORME'?'red':'amber';
    add(ev.date,`Réévaluation · v${Number(ev.version)||1}`,result,tone,`${donorConformityLabel(ev.donConformity||ev.donStatus||ev.conformity)}${ev.analysisPoleQualite?` · ${ev.analysisPoleQualite}`:''}`,'internal2');
  }
  for(const ev of [...finalReturnHistory(r)].sort((a,b)=>Number(a.version||0)-Number(b.version||0)||String(a.date||'').localeCompare(String(b.date||'')) )){
    const result=finalReturnStatusLabel(ev.status||ev.decision);const tone=finalReturnStatusCode(ev.status||ev.decision)==='VALIDE'?'green':'red';

}

function safeArchiveName(value){return String(value||'audio').replace(/[\\/:*?"<>|]/g,'_').replace(/\.\.+/g,'_').trim()||'audio'}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function collectBatchAudio(rows){const files=[];const missing=[];const used=new Set();for(const r of rows){const a=r.audio||{};const src=a.localUrl||a.drive_file_url||'';const fallbackAudioName=`${safeArchiveName(r.baseName||'audio')}_${safeArchiveName(recordIndexValue(r,'indice-non-renseigne'))}.audio`;const original=safeArchiveName(a.drive_file_name||fallbackAudioName);if(!src){missing.push({record:r.id,filename:original,reason:'Fichier audio non accessible dans cette démonstration'});continue}try{const response=await fetch(src);if(!response.ok)throw new Error(`HTTP ${response.status}`);const bytes=new Uint8Array(await response.arrayBuffer());if(!bytes.length)throw new Error('fichier vide');let name=`${safeArchiveName(r.baseName||'Base')}_${safeArchiveName(recordIndexValue(r,'indice-non-renseigne'))}_${original}`;if(used.has(name)){const dot=name.lastIndexOf('.');name=dot>0?`${name.slice(0,dot)}_${files.length+1}${name.slice(dot)}`:`${name}_${files.length+1}`}used.add(name);files.push({record:r.id,name:`Enregistrements/${name}`,data:bytes})}catch(error){missing.push({record:r.id,filename:original,reason:`Téléchargement impossible (${error.message||'accès refusé'})`})}}return {files,missing}}
function bindAudio(){const audio=document.querySelector('[data-audio-element]');if(!audio)return;audio.addEventListener('timeupdate',()=>{const current=document.querySelector('[data-audio-current]');const seek=document.querySelector('[data-audio-seek]');const duration=document.querySelector('[data-audio-duration]');if(current)current.textContent=secondsToClock(audio.currentTime);if(seek&&audio.duration)seek.value=Math.round(audio.currentTime/audio.duration*100);if(duration&&Number.isFinite(audio.duration))duration.textContent=secondsToClock(audio.duration)});audio.addEventListener('loadedmetadata',()=>{const d=document.querySelector('[data-audio-duration]');if(d)d.textContent=secondsToClock(audio.duration)});audio.addEventListener('ended',()=>{const btn=document.querySelector('[data-action="audio-toggle"]');if(btn)btn.innerHTML=ic('play')})}
function secondsToClock(v){if(!Number.isFinite(v))return '00:00';const n=Math.max(0,Math.floor(v));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function durationToSeconds(value){const p=String(value||'').split(':').map(Number);if(p.some(x=>!Number.isFinite(x)||x<0))return null;if(p.length===2&&p[1]<60)return p[0]*60+p[1];if(p.length===3&&p[1]<60&&p[2]<60)return p[0]*3600+p[1]*60+p[2];return null}
function audioAction(action,id){const audio=document.querySelector('[data-audio-element]');if(!audio){toast('Aucun flux audio local n’est associé à cette fiche.','warning');return}if(action==='audio-toggle'){if(audio.paused){audio.play().then(()=>{const btn=document.querySelector('[data-action="audio-toggle"]');if(btn)btn.innerHTML=ic('pause')}).catch(()=>toast('Impossible de lire ce format dans le navigateur.','warning'))}else{audio.pause();const btn=document.querySelector('[data-action="audio-toggle"]');if(btn)btn.innerHTML=ic('play')}}else if(action==='audio-back')audio.currentTime=Math.max(0,audio.currentTime-5);else if(action==='audio-forward')audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5)}
function openDrive(id){const r=getRecord(id);toast(r?.audio?.objectId?'L’audio est disponible dans le lecteur sécurisé de la fiche.':'Aucun objet MinIO local n’est associé à cet ancien enregistrement.','warning')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.querySelector('.sidebar-scrim').classList.remove('open')}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.querySelector('.sidebar-scrim').classList.add('open')}
function updateGlobalSearch(q){if(!q.trim()){searchResults.classList.remove('open');searchResults.innerHTML='';return}const term=q.toLowerCase();const matches=state.records.filter(r=>recordSearchValues(r).some(x=>String(x||'').toLowerCase().includes(term))).slice(0,7);searchResults.innerHTML=matches.length?matches.map(r=>`<button class="search-result" data-open-record="${esc(r.id)}"><span class="result-icon">${ic('clipboard')}</span><span class="search-result-copy"><strong>Indice ${esc(recordIndexValue(r))} · ${esc(r.agent)}</strong><small>${esc(r.campaign)} · ${esc(statusText(r.status))}</small></span>${ic('chevron-right')}</button>`).join(''):`<div class="search-empty">Aucune fiche ne correspond à « ${esc(q)} ».</div>`;searchResults.classList.add('open')}
function handleSubmit(event){const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const type=form.dataset.form;if(backend.syncBlocked&&!['accessRole','demoUser','clientSendExport'].includes(type)){toast('La synchronisation est suspendue. Téléchargez la copie de récupération ou rechargez PostgreSQL avant de modifier les données.','warning');return}switch(type){case'authLogin':loginToLocalBackend(form);break;case'authChangePassword':changeLocalPassword(form);break;case'newRecord':createNewRecord(form);break;case'clientSendExport':downloadClientSendExport(form);break;case'confirmClientSendFtp':confirmClientSendFtp(form);break;case'clientReturn':saveClientReturn(form);break;case'finalReturn':saveFinalReturn(form);break;case'newTask':createTask(form);break;case'newDebrief':createDebrief(form);break;case'newCriterion':createCriterion(form);break;case'newLabel':createLabel(form);break;case'accessRole':saveAccessRole(form);break;case'demoUser':saveDemoUser(form);break;case'assignLabels':assignLabels(form);break;case'editRecord':editRecord(form);break;case'evaluation':saveEvaluation(form);break;case'saveDrive':saveDriveSettings(form);break;case'closeRecord':closeRecord(new FormData(form).get('recordId'));break;default:break}}
function permissionForAction(actionEl){const action=actionEl?.dataset?.action;const fixed={export:'api_dashboard_export','export-record':'records_view','new-record':'records_manage','edit-record':'records_manage','new-task':'tasks','toggle-task':'tasks','new-debrief':'debriefs','new-criterion':'quality_settings','add-criterion':'quality_settings','delete-criterion':'quality_settings','new-label':'quality_settings','delete-label':'quality_settings','save-drive':'quality_settings','new-role':'users_roles','edit-role':'users_roles','delete-role':'users_roles','new-user':'users_roles','edit-user':'users_roles','delete-user':'users_roles','assign-label':'records_manage','prepare-client-send':'client_send','prepare-client-send-export':'client_send','confirm-client-send-ftp':'client_send','close-record':'final_return','open-task-record':'tasks','open-drive':'records_view','client-role-info':'portal','portal-open-record':'portal','open-client-feedback':'client_returns','reset-demo':'users_roles'};
  if(action==='begin-evaluation')return actionEl.dataset.stage==='internal2'?'reevaluation':'synergy1';
  if(action==='open-final-return-modal')return 'final_return';if(action==='init-empty-state')return 'users_roles';
  return fixed[action]||'';
}
function handleAction(actionEl){const action=actionEl.dataset.action;const id=actionEl.dataset.recordId||actionEl.dataset.openRecord||app.recordId;if(backend.syncBlocked&&['toggle-task','delete-criterion','delete-label'].includes(action)){toast('La synchronisation est suspendue. Téléchargez la copie de récupération ou rechargez PostgreSQL avant de modifier les données.','warning');return}const requiredPermission=permissionForAction(actionEl);if(backend.enabled&&backend.authenticated&&requiredPermission&&!backend.permissions.has(requiredPermission)){toast(`Votre rôle ne permet pas cette action (${requiredPermission}).`,'warning');return}switch(action){
  case'download-pending-changes':downloadPendingSnapshot();break;
  case'reload-server-state':reloadServerStateAfterConflict();break;

  case'new-record':openNewRecord();break;
  case'portal-open-record':openRecord(id,actionEl.dataset.stage||'clientReturns');break
  case'new-task':openTaskModal(actionEl.dataset.recordId||'');break;
  case'new-debrief':openDebriefModal(actionEl.dataset.recordId||'',actionEl.dataset.agentId||'');break;
  case'new-label':openLabelModal();break;
  case'new-role':openRoleModal();break;case'edit-role':openRoleModal(actionEl.dataset.roleId);break;case'delete-role':deleteAccessRole(actionEl.dataset.roleId);break;case'new-user':openDemoUserModal();break;case'edit-user':openDemoUserModal(actionEl.dataset.userId);break;case'delete-user':deleteDemoUser(actionEl.dataset.userId);break;
  case'add-criterion':openCriterionModal(actionEl.dataset.stage);break;
  case'delete-label':deleteLabel(actionEl.dataset.labelId);break;
  case'delete-criterion':deleteCriterion(actionEl.dataset.stage,actionEl.dataset.criterionId);break;
  case'assign-label':openAssignLabel(actionEl.dataset.recordId);break;
  case'edit-record':openEditRecord(actionEl.dataset.recordId);break;
  case'begin-evaluation':stageFromAction(actionEl);break;case'open-record':openRecord(actionEl.dataset.recordId||id,actionEl.dataset.recordTab||'internal1');break;
  case'open-client-feedback':openEvaluationModal(id,'clientReturns');break;
  case'prepare-client-send':if(clientSendAllowed(getRecord(id))){app.selectedToSend.clear();app.selectedToSend.add(id);app.page='send';app.fromPage='record';render()}else toast('Cette fiche n’est plus disponible dans la liste d’envoi.', 'warning');break;
  case'prepare-client-send-export':openClientSendExportModal();break;
  case'confirm-client-send-ftp':openClientSendFtpModal();break;
  case'close-record':confirmCloseRecord(id);break;
  case'toggle-task':toggleTask(actionEl.dataset.taskId);break;
  case'open-task-record':{const task=state.tasks.find(t=>t.id===actionEl.dataset.taskId);openRecord(actionEl.dataset.recordId||task?.recordId,actionEl.dataset.recordTab||taskRecordTab(task));break;}
  case'open-drive':openDrive(id);break;
  case'audio-toggle':case'audio-back':case'audio-forward':audioAction(action,id);break;
  case'close-modal':closeModal();break;
  case'open-sidebar':openSidebar();break;
  case'close-sidebar':closeSidebar();break;
  case'record-back':{const back=app.fromPage||'records';app.page=back;render();window.scrollTo({top:0,behavior:'smooth'});break}
  case'open-final-return':openFinalReturn(actionEl.dataset.recordId||app.recordId);break;case'open-final-return-modal':openFinalReturnModal(actionEl.dataset.recordId||app.recordId);break;case'open-comparison':openFinalReturn(actionEl.dataset.recordId||app.recordId);break;
  case'export':if(backend.enabled&&backend.authenticated)apiRequest('/quality/api/dashboard/export').then(result=>exportCsv(result.summary?.agentMetrics||[],'qualicontact-statistiques-agents.csv')).catch(error=>toast(error.message,'error'));else exportCsv(state.records,'qualicontact-fiches-demo.csv');break;
  case'export-record':{const r=getRecord(actionEl.dataset.recordId);if(r)exportCsv([r],`${safeArchiveName(r.baseName||'base')}_${safeArchiveName(recordIndexValue(r,'indice-non-renseigne'))}.csv`);break}
  case'notifications':toast('Aucune notification nouvelle dans cette démonstration.','warning');break;
  case'client-role-info':toast(backend.enabled?'Vue client locale : chaque requête API est filtrée par rôle et client affecté.':'Vue de démonstration locale; aucune isolation API réelle n’est active.','warning');break;
  case'user-menu':if(backend.enabled&&backend.authenticated)logoutLocalBackend();else toast('Session de démonstration · Sarah Ben Salem · Qualiticienne','warning');break;
  case'auth-logout':logoutLocalBackend();break;
  case'auth-retry':initializeBackendAuth();break;
  case'copy-temporary-password':if(backend.temporaryPassword&&navigator.clipboard?.writeText)navigator.clipboard.writeText(backend.temporaryPassword).then(()=>toast('Mot de passe copié.')).catch(()=>toast('Copie impossible; sélectionnez le texte affiché.','warning'));else toast('La copie automatique n’est pas disponible.','warning');break;
  case'init-empty-state':initializeEmptyStateOnServer().catch(error=>toast(error.message,'error'));break;
  case'reset-demo':if(backend.enabled&&backend.authenticated)toast('La base PostgreSQL n’est jamais réinitialisée depuis le navigateur. Utilisez une procédure de sauvegarde/restauration administrateur.','warning');else if(confirm('Réinitialiser toutes les modifications locales et restaurer les données de démonstration ?')){localStorage.removeItem(DB_KEY);window.location.reload()}break;
  default:break;
}}

document.addEventListener('click',event=>{
  if(event.target===modalRoot){closeModal();return}
  if(!searchResults.contains(event.target)&&event.target!==searchInput)searchResults.classList.remove('open');
  const pageButton=event.target.closest('[data-page]');
  if(pageButton){event.preventDefault();const page=pageButton.dataset.page;if(pageButton.dataset.settingsTab)app.settingsTab=pageButton.dataset.settingsTab;goPage(page);return}
  const settingTab=event.target.closest('[data-settings-tab]');
  if(settingTab){if(backend.enabled&&backend.authenticated&&!canOpenSettingsTab(settingTab.dataset.settingsTab)){toast('Votre rôle ne permet pas d’accéder à ces paramètres.','warning');return}app.settingsTab=settingTab.dataset.settingsTab;render();return}
  const recTab=event.target.closest('[data-record-tab]');
  if(recTab){const permission=({internal1:'synergy1',clientReturns:'client_returns',internal2:'reevaluation',finalReturn:'final_return'})[recTab.dataset.recordTab];if(backend.enabled&&backend.authenticated&&permission&&!backend.permissions.has(permission)&&!backend.permissions.has('records_view')){toast('Votre rôle ne permet pas de consulter cette étape.','warning');return}app.recordTab=recTab.dataset.recordTab;render();return}
  const agent=event.target.closest('[data-agent-profile]');
  if(agent){if(!canOpenPage('agentProfile')){toast('Votre rôle ne permet pas d’accéder au profil agent.','warning');return}app.agentId=agent.dataset.agentProfile;app.page='agentProfile';render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(event.target.matches('input[data-send-select]'))return;
  const action=event.target.closest('[data-action]');
  if(action){handleAction(action);return}
  const record=event.target.closest('[data-open-record]');
  if(record){openRecord(record.dataset.openRecord,record.dataset.recordTab||'internal1');return}
  const searchRecord=event.target.closest('[data-search-record]');
  if(searchRecord){openRecord(searchRecord.dataset.searchRecord);return}
});
document.addEventListener('submit',handleSubmit);
document.addEventListener('input',event=>{
  if(event.target===searchInput){updateGlobalSearch(searchInput.value);return}
  if(event.target.matches('[data-filter="search"]')){app.filterRecords.search=event.target.value;const pos=event.target.selectionStart;mainContent.innerHTML=renderRecords();const next=mainContent.querySelector('#recordSearch');next?.focus();try{next?.setSelectionRange(pos,pos)}catch(_){ }return}
  if(event.target.id==='agentSearch'){const q=event.target.value.toLowerCase();document.querySelectorAll('.agent-card').forEach(card=>{card.classList.toggle('hidden',!card.textContent.toLowerCase().includes(q))});return}
  if(event.target.matches('[data-audio-seek]')){const audio=document.querySelector('[data-audio-element]');if(audio?.duration)audio.currentTime=Number(event.target.value)/100*audio.duration;return}
});
document.addEventListener('change',event=>{
  if(event.target.matches('[data-user-account-type],[data-user-role-choice]')){updateDemoUserForm(event.target.form);return}
  if(event.target.matches('[data-user-role]')){assignUserRole(event.target.dataset.userRole,event.target.value);return}
  if(event.target.name==='audioFile'){
    const file=event.target.files?.[0];if(file)updateFilenameParsePreview(file,event.target.form);
    return;
  }
  if(event.target.name==='debriefAudioFile'){
    updateDebriefFilenameFields(event.target.files?.[0]||null,event.target.form);
    return;
  }
  if(event.target.matches('[data-filter="status"]')){app.filterRecords.status=event.target.value;render();return}
  if(event.target.matches('[data-filter="campaign"]')){app.filterRecords.campaign=event.target.value;render();return}
  if(event.target.matches('[data-filter="compliance"]')){app.filterRecords.compliance=event.target.value;render();return}
  if(event.target.matches('[data-send-select]')){if(event.target.checked)app.selectedToSend.add(event.target.dataset.sendSelect);else app.selectedToSend.delete(event.target.dataset.sendSelect);render();return}
  if(event.target.id==='feedbackFilter'){app.feedbackFilter=event.target.value;render();return}
  if(event.target.id==='taskFilter'){app.taskFilter=event.target.value;render();return}
  if(event.target.id==='batchStatusFilter'){app.batchStatus=event.target.value;render();return}
  if(event.target.matches('[data-audio-speed]')){const audio=document.querySelector('[data-audio-element]');if(audio)audio.playbackRate=Number(event.target.value);return}
});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();searchInput.focus()}if(event.key==='Escape'){if(modalRoot.classList.contains('open'))closeModal();searchResults.classList.remove('open');closeSidebar()}});
initializeBackendAuth();

</script>
